# Mandelbrot Altitude settings UI
screen = <profile> [MANDELBROT]
screen.columns = 1
screen.MANDELBROT = START_ALTITUDE BLOCKS_PER_DOUBLING PAN_PERIOD PAN_RANGE MAX_ITERATIONS MAX_ZOOM FRACTAL_OPACITY
screen.MANDELBROT.columns = 2

sliders = START_ALTITUDE BLOCKS_PER_DOUBLING PAN_PERIOD PAN_RANGE MAX_ITERATIONS MAX_ZOOM FRACTAL_OPACITY

profile.PERFORMANCE = MAX_ITERATIONS=64 MAX_ZOOM=16384.0
profile.BALANCED = MAX_ITERATIONS=128 MAX_ZOOM=131072.0
profile.CINEMATIC = MAX_ITERATIONS=256 MAX_ZOOM=262144.0

# Keep the sky base geometry for depth/render ordering, but hide vanilla clouds,
# sun and moon so they cannot occlude the fractal.
clouds = off
sun = false
moon = false
stars = true
sky = true
