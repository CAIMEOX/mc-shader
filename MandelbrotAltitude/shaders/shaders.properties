# Mandelbrot Altitude settings UI
screen = <profile> [MANDELBROT]
screen.columns = 1
screen.MANDELBROT = START_ALTITUDE BLOCKS_PER_DOUBLING VOID_TWIST_PERIOD PAN_PERIOD PAN_RANGE MAX_ITERATIONS MAX_ZOOM_STEPS FRACTAL_OPACITY
screen.MANDELBROT.columns = 2

sliders = START_ALTITUDE BLOCKS_PER_DOUBLING VOID_TWIST_PERIOD PAN_PERIOD PAN_RANGE MAX_ITERATIONS MAX_ZOOM_STEPS FRACTAL_OPACITY

profile.PERFORMANCE = MAX_ITERATIONS=64 MAX_ZOOM_STEPS=40
profile.BALANCED = MAX_ITERATIONS=128 MAX_ZOOM_STEPS=80
profile.CINEMATIC = MAX_ITERATIONS=256 MAX_ZOOM_STEPS=96

# The companion Fabric mod publishes an RGBA32F reference orbit at this ID.
# When it is absent, final.fsh rejects the missing marker and uses FP32 direct mode.
customTexture.mandelbrotReference=mandelbrot_altitude:reference_orbit

# Keep the sky base geometry for depth/render ordering, but hide vanilla clouds,
# sun and moon so they cannot occlude the fractal.
clouds = off
sun = false
moon = false
stars = true
sky = true
