# SolWorld settings UI
screen = <profile> [GEOMETRY] [LOOK]
screen.columns = 1
screen.GEOMETRY = SOL_SCALE WARP_STRENGTH ANISOTROPY GEODESIC_BEND AXIS_ROTATION
screen.GEOMETRY.columns = 2
screen.LOOK = AXIS_TINT DISTANCE_FOG DISTANCE_GLOW
screen.LOOK.columns = 2

sliders = SOL_SCALE WARP_STRENGTH ANISOTROPY GEODESIC_BEND AXIS_ROTATION AXIS_TINT DISTANCE_FOG DISTANCE_GLOW

profile.GENTLE = SOL_SCALE=96.0 WARP_STRENGTH=0.50 ANISOTROPY=0.50 GEODESIC_BEND=0.20 AXIS_ROTATION=0.0 AXIS_TINT=0.05 DISTANCE_FOG=0.10 DISTANCE_GLOW=0.05
profile.SOL = SOL_SCALE=48.0 WARP_STRENGTH=0.80 ANISOTROPY=1.00 GEODESIC_BEND=0.55 AXIS_ROTATION=0.0 AXIS_TINT=0.12 DISTANCE_FOG=0.25 DISTANCE_GLOW=0.15
profile.IMPOSSIBLE = SOL_SCALE=24.0 WARP_STRENGTH=1.00 ANISOTROPY=1.50 GEODESIC_BEND=1.00 AXIS_ROTATION=45.0 AXIS_TINT=0.20 DISTANCE_FOG=0.40 DISTANCE_GLOW=0.25

frustum.culling=false
occlusion.culling=false

clouds = fancy
sun = true
moon = true
stars = true
sky = true
