[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["build", "dist-newstyle", "harness/build", "playground", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
