# SphericalWorld settings UI
screen = <profile> [GEOMETRY] [ATMOSPHERE]
screen.columns = 1
screen.GEOMETRY = SPHERE_RADIUS WARP_STRENGTH VERTICAL_FOLLOW
screen.GEOMETRY.columns = 2
screen.ATMOSPHERE = ANTIPODE_GLOW SPHERE_FOG HORIZON_TINT
screen.ATMOSPHERE.columns = 2

sliders = SPHERE_RADIUS WARP_STRENGTH VERTICAL_FOLLOW ANTIPODE_GLOW SPHERE_FOG HORIZON_TINT

profile.GENTLE = SPHERE_RADIUS=128.0 WARP_STRENGTH=0.55 VERTICAL_FOLLOW=0.50 ANTIPODE_GLOW=0.08 SPHERE_FOG=0.10 HORIZON_TINT=0.05
profile.SPHERICAL = SPHERE_RADIUS=64.0 WARP_STRENGTH=0.90 VERTICAL_FOLLOW=0.85 ANTIPODE_GLOW=0.22 SPHERE_FOG=0.28 HORIZON_TINT=0.12
profile.CLOSED = SPHERE_RADIUS=32.0 WARP_STRENGTH=1.00 VERTICAL_FOLLOW=1.00 ANTIPODE_GLOW=0.35 SPHERE_FOG=0.40 HORIZON_TINT=0.20

frustum.culling=false
occlusion.culling=false

clouds = fancy
sun = true
moon = true
stars = true
sky = true
