# HyperbolicWorld settings UI
screen = <profile> [CURVATURE] [BOUNDARY]
screen.columns = 1
screen.CURVATURE = CURVATURE_RADIUS WARP_STRENGTH VERTICAL_COMPRESSION CHART_ROTATION
screen.CURVATURE.columns = 2
screen.BOUNDARY = BOUNDARY_FOG BOUNDARY_GLOW BOUNDARY_DARKEN
screen.BOUNDARY.columns = 2

sliders = CURVATURE_RADIUS WARP_STRENGTH VERTICAL_COMPRESSION CHART_ROTATION BOUNDARY_FOG BOUNDARY_GLOW BOUNDARY_DARKEN

profile.GENTLE = CURVATURE_RADIUS=192.0 WARP_STRENGTH=0.55 VERTICAL_COMPRESSION=0.50 CHART_ROTATION=0.0 BOUNDARY_FOG=0.15 BOUNDARY_GLOW=0.08 BOUNDARY_DARKEN=0.10
profile.HYPERBOLIC = CURVATURE_RADIUS=96.0 WARP_STRENGTH=0.85 VERTICAL_COMPRESSION=0.75 CHART_ROTATION=0.0 BOUNDARY_FOG=0.35 BOUNDARY_GLOW=0.18 BOUNDARY_DARKEN=0.20
profile.ESCHER = CURVATURE_RADIUS=48.0 WARP_STRENGTH=1.00 VERTICAL_COMPRESSION=1.00 CHART_ROTATION=45.0 BOUNDARY_FOG=0.55 BOUNDARY_GLOW=0.30 BOUNDARY_DARKEN=0.35

# A nonlinear vertex map can move geometry that vanilla considered invisible
# back into the view. Conservative culling prevents holes at a performance cost.
frustum.culling=false
occlusion.culling=false

clouds = fancy
sun = true
moon = true
stars = true
sky = true
